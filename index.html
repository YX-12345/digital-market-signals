<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scotland Health Data Visualization</title>
  <style>

      margin: 0;
      background: #f5f7fa;
      color: #142338;
      font: 1rem/1.6 system-ui, sans-serif;
    }

      max-width: 44rem;
      margin: clamp(3rem, 12vw, 8rem) auto;

  <main>
    <h1>Scotland Health Data Visualization</h1>
